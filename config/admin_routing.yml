cyfrowe_nps_admin_survey:
    resource: |
        alias: cyfrowe_nps.survey
        path: nps/responses
        section: admin
        templates: "@SyliusAdmin/Crud"
        only: ['index']
        grid: cyfrowe_nps_admin_survey
        permission: true
        vars:
            all:
                subheader: cyfrowe_nps.ui.responses_subheader
            index:
                icon: comments
    type: sylius.resource

cyfrowe_nps_admin_configuration:
    resource: |
        alias: cyfrowe_nps.channel_configuration
        path: nps/settings
        section: admin
        templates: "@SyliusAdmin/Crud"
        except: ['show']
        redirect: update
        grid: cyfrowe_nps_admin_configuration
        permission: true
        vars:
            all:
                subheader: cyfrowe_nps.ui.settings_subheader
            index:
                icon: cog
    type: sylius.resource

cyfrowe_nps_admin_survey_show:
    path: nps/responses/{id}
    methods: [GET]
    defaults:
        _controller: cyfrowe_nps.controller.admin.show_response
    requirements:
        id: '\d+'

cyfrowe_nps_admin_survey_export_csv:
    path: nps/responses/export.csv
    methods: [GET]
    defaults:
        _controller: cyfrowe_nps.controller.admin.export_csv

cyfrowe_nps_admin_survey_handling:
    path: nps/responses/{id}/handling
    methods: [POST]
    defaults:
        _controller: cyfrowe_nps.controller.admin.save_handling
    requirements:
        id: '\d+'

# PUT as well: on the edit screen the button posts the update form, `_method=PUT` included.
cyfrowe_nps_admin_send_test_email:
    path: nps/settings/test-email
    methods: [POST, PUT]
    defaults:
        _controller: cyfrowe_nps.controller.admin.send_test_email
